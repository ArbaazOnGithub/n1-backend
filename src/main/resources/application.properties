spring.application.name=N1Solution
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:n1solution}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:9792}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Advanced Performance Optimizations
spring.main.lazy-initialization=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=1800000

# Tomcat Thread Pool Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=15
server.tomcat.max-connections=8192
server.tomcat.accept-count=100

